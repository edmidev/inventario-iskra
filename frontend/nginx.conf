server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Never cache API responses at the edge or in browsers: inventory data and sessions must be fresh.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
  }

  # Content-hashed build output never changes under the same name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location ~ ^/workbox-[0-9a-f]+\.js$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # The shell and the service worker must be revalidated on every load, or updates never arrive.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  location = /registerSW.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # Icons and other static files keep their name across releases: let them revalidate.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
