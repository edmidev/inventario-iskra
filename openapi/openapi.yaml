openapi: 3.0.3
info:
  title: Inventario API
  version: 0.1.0
  description: Inventory management API (assets, consumables, custody, maintenance).
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
