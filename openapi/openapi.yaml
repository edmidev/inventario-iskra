openapi: 3.0.3
info:
  title: Inventario API
  version: 0.1.0
  description: Inventory management API (assets, consumables, custody, maintenance).
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      description: Returns an access token and sets the httpOnly `refresh_token` cookie (path `/api/v1/auth`). Failures never reveal whether the email exists. Repeated failures return 429.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh cookie and get a new access token
      description: Reads the `refresh_token` cookie. The presented token is rotated. Presenting the just-rotated token again within a short grace window (15 s by default) is idempotent and returns a fresh session; reusing it after the window revokes every session of the user.
      security: []
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the refresh token and clear the cookie
      security: []
      responses:
        "204": { description: Signed out (idempotent) }
  /auth/me:
    get:
      operationId: getMe
      summary: Current user
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/password:
    post:
      operationId: changeOwnPassword
      summary: Change the caller's password
      description: Revokes all refresh tokens of the caller. The client must sign in again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /users:
    get:
      operationId: listUsers
      summary: List users (admin)
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createUser
      summary: Create a user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                password: { type: string, minLength: 10, maxLength: 128 }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /users/{id}:
    patch:
      operationId: updateUser
      summary: Update name, role or active flag (admin)
      description: The last active admin cannot be deactivated or demoted (409 `last_admin`). Deactivating a user revokes their sessions.
      parameters:
        - { $ref: "#/components/parameters/UserId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                role: { $ref: "#/components/schemas/Role" }
                active: { type: boolean }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /users/{id}/password:
    post:
      operationId: resetUserPassword
      summary: Reset a user's password (admin)
      description: Revokes all refresh tokens of the target user.
      parameters:
        - { $ref: "#/components/parameters/UserId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "204": { description: Password reset }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /categories:
    get:
      operationId: listCategories
      summary: List categories
      responses:
        "200":
          description: All categories, ordered by name
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createCategory
      summary: Create a category (admin)
      description: The name is unique ignoring case; `code_prefix` (2-8 chars, A-Z and 0-9, stored uppercase) is unique and feeds generated item codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code_prefix]
              properties:
                name: { type: string, maxLength: 120 }
                code_prefix: { type: string, example: HER }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /categories/{id}:
    patch:
      operationId: updateCategory
      summary: Rename a category or change its prefix (admin)
      description: A new prefix only affects codes generated afterwards; existing codes never change.
      parameters:
        - { $ref: "#/components/parameters/NumericId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                code_prefix: { type: string }
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteCategory
      summary: Delete a category (admin)
      description: 409 `category_in_use` while any item (including soft-deleted ones) references it.
      parameters:
        - { $ref: "#/components/parameters/NumericId" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /suppliers:
    get:
      operationId: listSuppliers
      summary: List suppliers
      description: Ordered by name (case-insensitive). `q` matches name, contact name and email.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: A page of suppliers
          content:
            application/json:
              schema:
                type: object
                required: [data, total, limit, offset]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Supplier" }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSupplier
      summary: Create a supplier (operator, admin)
      description: The name is unique among live suppliers, ignoring case (409 `supplier_name_taken`). `active` defaults to true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                contact_name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                phone: { type: string, maxLength: 40 }
                notes: { type: string, maxLength: 1000 }
                active: { type: boolean, default: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplier" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /suppliers/{id}:
    get:
      operationId: getSupplier
      summary: Get a supplier
      parameters:
        - { $ref: "#/components/parameters/NumericId" }
      responses:
        "200":
          description: The supplier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplier" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateSupplier
      summary: Edit a supplier (operator, admin)
      description: Partial update; the merged supplier is revalidated. Deactivate with `active=false` to keep it out of new orders without deleting it.
      parameters:
        - { $ref: "#/components/parameters/NumericId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                contact_name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                phone: { type: string, maxLength: 40 }
                notes: { type: string, maxLength: 1000 }
                active: { type: boolean }
      responses:
        "200":
          description: Updated supplier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplier" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSupplier
      summary: Delete a supplier (operator, admin)
      description: Soft delete; the name becomes available again.
      parameters:
        - { $ref: "#/components/parameters/NumericId" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /purchase-orders:
    get:
      operationId: listPurchaseOrders
      summary: List purchase orders
      description: >-
        Newest first, with lines (no receipts). `q` matches the supplier name (substring, case-insensitive) or the
        order id (exact, optional leading `#`).
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/PurchaseOrderStatus" } }
        - { name: supplier_id, in: query, schema: { type: integer, format: int64 } }
        - { name: q, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: A page of purchase orders
          content:
            application/json:
              schema:
                type: object
                required: [data, total, limit, offset]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PurchaseOrder" }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      operationId: createPurchaseOrder
      summary: Create a draft purchase order (operator, admin)
      description: >-
        The supplier must exist (422 on `supplier_id`) and be active (422 `supplier_inactive`). Lines are optional on
        a draft. Each line gives exactly one of `item_id` (an existing consumable; an asset is rejected with
        `existing_item_must_be_consumable` on `lines[i].item_id`) or `new_item` (validated now, created on first
        receipt). Assets must use `new_item` and are capped at 100 units per line. Amounts are integer minor units
        of the order's currency.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseOrderCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseOrder" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /purchase-orders/{id}:
    get:
      operationId: getPurchaseOrder
      summary: Get a purchase order with its lines and receipts
      parameters:
        - { $ref: "#/components/parameters/NumericId" }
      responses:
        "200":
          description: The order; each receipt lists the items it brought into the catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseOrder" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updatePurchaseOrder
      summary: Edit a draft purchase order (operator, admin)
      description: >-
        Draft only (409 `invalid_state` otherwise). Absent fields are kept; `exchange_rate` and `expected_at` can be
        cleared with null. When `lines` is given it replaces the whole line set (`[]` empties it); the merged order
        is revalidated.
      parameters:
        - { $ref: "#/components/parameters/NumericId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseOrderUpdate" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseOrder" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /purchase-orders/{id}/order:
    post:
      operationId: placePurchaseOrder
      summary: Place a draft (draft to ordered) (operator, admin)
      description: Needs at least one line (422 on `lines`) and an active supplier (422 `supplier_inactive`).
      parameters:
        - { $ref: "#/components/parameters/NumericId" }
      responses:
        "200":
          description: The ordered order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseOrder" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /purchase-orders/{id}/cancel:
    post:
      operationId: cancelPurchaseOrder
      summary: Cancel a purchase order (operator, admin)
      description: Allowed from draft or ordered, and only while nothing was received (409 `invalid_state` otherwise).
      parameters:
        - { $ref: "#/components/parameters/NumericId" }
      responses:
        "200":
          description: The cancelled order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseOrder" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /purchase-orders/{id}/receive:
    post:
      operationId: receivePurchaseOrder
      summary: Register a delivery (operator, admin)
      description: >-
        Allowed in `ordered` and `partially_received` (409 `invalid_state` otherwise). Each quantity must be greater
        than 0 and at most what is still pending on the line (422 `over_receipt`, on `lines[i].quantity`); the
        location must exist (422 on `location_id`). In one transaction the order row is locked, catalog items are
        created for `new_item` lines (an asset line creates one item per received unit, each with its own generated
        code, at `location_id`; a consumable is created once, with no opening stock), an `in` stock movement is
        recorded at `location_id` for every consumable line, and the receipt is stored. Any failure rolls
        everything back. With a non-empty `client_key` a repeated request returns the original receipt (200) with
        no side effects; the first success is 201.
      parameters:
        - { $ref: "#/components/parameters/NumericId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReceiveRequest" }
      responses:
        "200":
          description: Replay of an earlier request with the same `client_key`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceiveResult" }
        "201":
          description: Receipt registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceiveResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /locations:
    get:
      operationId: listLocations
      summary: List locations
      responses:
        "200":
          description: All locations (flat list; use `parent_id` to build the tree)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Location" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createLocation
      summary: Create a location (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind]
              properties:
                name: { type: string, maxLength: 120 }
                kind: { $ref: "#/components/schemas/LocationKind" }
                parent_id: { type: integer, format: int64, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /locations/{id}:
    patch:
      operationId: updateLocation
      summary: Update a location (admin)
      description: "Send `parent_id: null` to detach. A parent that would create a cycle returns 409 `location_cycle`."
      parameters:
        - { $ref: "#/components/parameters/NumericId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                kind: { $ref: "#/components/schemas/LocationKind" }
                parent_id: { type: integer, format: int64, nullable: true }
      responses:
        "200":
          description: Updated location
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteLocation
      summary: Delete a location (admin)
      description: 409 `location_in_use` while it has child locations or items.
      parameters:
        - { $ref: "#/components/parameters/NumericId" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /items:
    get:
      operationId: listItems
      summary: Search and filter items
      description: Soft-deleted items are never listed. `q` is a case-insensitive substring match over code and description. Invalid parameters return 422 with `error.fields`.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category_id, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ItemStatus" } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/ItemKind" } }
        - { name: availability, in: query, schema: { $ref: "#/components/schemas/Availability" } }
        - name: location_id
          in: query
          description: Assets in that location, and consumables that have stock there (a consumable stocked in several locations matches any of them).
          schema: { type: integer, format: int64 }
        - name: low_stock
          in: query
          description: "`true` keeps consumables with `stock_min > 0` and `stock_current <= stock_min`."
          schema: { type: boolean }
        - name: sort
          in: query
          description: Field to sort by; a leading `-` sorts descending.
          schema: { type: string, enum: [code, description, updated_at], default: code }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: One page of items
          content:
            application/json:
              schema:
                type: object
                required: [data, total, limit, offset]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }
                  total: { type: integer, description: Matches across all pages }
                  limit: { type: integer }
                  offset: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      operationId: createItem
      summary: Create an item (operator or admin)
      description: |
        Assets are always stock 1 with no unit. Consumables require a `unit` and are stocked per location: give the opening balance either as `stocks` (one row per location) or in the legacy form `stock_current` + optional `location_id` (no location puts it in the default location "Sin ubicación"); sending `stocks` together with `stock_current` or `location_id` is a 422. Each opening row writes one `opening` movement in the same transaction; later changes go through stock movements. The code is generated as `ISK-<category prefix>-<sequence>` unless an admin supplies `code` (pattern `ISK-[A-Z0-9]+(-[A-Z0-9]+)*`); supplying a code without admin rights returns 403. Codes are immutable and stay reserved after deletion.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /items/by-code/{code}:
    get:
      operationId: getItemByCode
      summary: Look an item up by code (QR scanning)
      description: The code is matched case-insensitively.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, example: ISK-HER-001 } }
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /items/{id}:
    get:
      operationId: getItem
      summary: Get an item
      parameters:
        - { $ref: "#/components/parameters/ItemId" }
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateItem
      summary: Update an item (operator or admin)
      description: |
        Partial update. `attributes` replaces the whole object. `location_id` (assets) and `maintenance_interval_days` accept `null` to clear. A consumable has no single location: sending a non-null `location_id` for one is 422 `not_applicable` (move stock with a `transfer` movement). `code`, `kind` and `stock_current` cannot be changed (422 with the field named); stock changes belong to stock movements. While the item has an open failure (maintenance), changing `status` is rejected with 409 `item_under_repair`; re-sending the current status is allowed.
      parameters:
        - { $ref: "#/components/parameters/ItemId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemUpdate" }
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteItem
      summary: Soft-delete an item (operator or admin)
      description: The item disappears from reads and lists; its code stays reserved.
      parameters:
        - { $ref: "#/components/parameters/ItemId" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /items/{id}/movements:
    post:
      operationId: recordMovement
      summary: Record a stock movement (operator or admin)
      description: |
        Atomically changes an item and appends an immutable movement; the acting user is the authenticated caller.
        Consumables are stocked per location (`stocks` on the item); `items.stock_current` is always the sum of the locations.
        - `in` (`qty` > 0) adds at `location_id`; `out` (`qty` > 0) subtracts at `location_id` and never takes that location below 0 (409 `insufficient_stock`, the message names the location and what it holds); `adjust` sets the absolute counted quantity (`qty` >= 0) at `location_id` (requires a non-empty `note`) and the total follows. The movement records the location and the signed delta.
        - When `location_id` is omitted for in/out/adjust it is inferred: the item's only stocked location; for `in`/`adjust` on an item with no stock, the location of its latest movement or else the default location "Sin ubicación" (created on demand); `out` with no stock anywhere is 409 `insufficient_stock`. If the item is stocked in several locations the request is 422 `location_required` with the missing field in `fields`.
        - `transfer` of a consumable moves `qty` (> 0, at most what `from_location_id` holds, else 409 `insufficient_stock`) from `from_location_id` to `to_location_id` (different, both existing); `from_location_id` is inferred when the item has a single stocked location (422 `location_required` when ambiguous). The total is unchanged (`qty` of the movement is 0, `moved_qty` is the quantity moved). A location whose quantity reaches 0 stops being listed.
        - `transfer` of an asset moves it to `to_location_id`, which must exist and differ from its current location; `qty` and `from_location_id` must be omitted. An asset on loan cannot be transferred (409 `item_on_loan`): custody owns its location until it is returned.
        - `in`, `out` and `adjust` apply to consumables only (422 `not_applicable` for assets). `opening` movements are written by the system and cannot be requested.
      parameters:
        - { $ref: "#/components/parameters/ItemId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MovementRequest" }
      responses:
        "201":
          description: Movement recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovementResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    get:
      operationId: listMovements
      summary: Movement history of an item (any role)
      description: Newest first. Soft-deleted items return 404.
      parameters:
        - { $ref: "#/components/parameters/ItemId" }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/MovementType" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: One page of movements
          content:
            application/json:
              schema:
                type: object
                required: [data, total, limit, offset]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Movement" }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /stock/alerts:
    get:
      operationId: listStockAlerts
      summary: Consumables at or below their minimum stock (any role)
      description: Consumables with `stock_min > 0` and `stock_current <= stock_min` (the total across locations), most severe (lowest `stock_current - stock_min`) first, then by code. Each alert carries the per-location breakdown in `stocks`.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: One page of alerts
          content:
            application/json:
              schema:
                type: object
                required: [data, total, limit, offset]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/StockAlert" }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /items/{id}/assign:
    post:
      operationId: assignItem
      summary: Lend an asset to a person or container (operator or admin)
      description: |
        Atomically creates an active assignment and moves the item's `location_id` to the assignee; the previous location is remembered as the assignment's origin. The acting user is the authenticated caller.
        - Only assets can be lent (422 `not_applicable` for consumables, which move with stock transfers).
        - `assignee_location_id` must exist and be a `person` or `container` location (422 on that field).
        - `due_at` is optional and must be in the future (422).
        - The item must be `functional` (409 `item_not_available`) and not already on loan (409 `already_assigned`). The database guarantees at most one active assignment per item, so parallel requests yield exactly one 201.
      parameters:
        - { $ref: "#/components/parameters/ItemId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignRequest" }
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /items/{id}/return:
    post:
      operationId: returnItem
      summary: Return a lent asset (operator or admin)
      description: |
        Closes the item's active assignment and moves the item to `return_location_id` when given, otherwise back to the location it had when lent. If that origin location no longer exists the item is left without a location. The item's status is untouched, so an item that broke while on loan can still be returned. Without an active assignment the call fails with 409 `not_assigned`. The request body is optional.
      parameters:
        - { $ref: "#/components/parameters/ItemId" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnRequest" }
      responses:
        "200":
          description: The closed assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /items/{id}/custody:
    get:
      operationId: listItemCustody
      summary: Loan history of an item (any role)
      description: Newest first, including the active assignment. Soft-deleted items return 404.
      parameters:
        - { $ref: "#/components/parameters/ItemId" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: One page of assignments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignmentPage" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /custody/active:
    get:
      operationId: listActiveCustody
      summary: Items currently on loan (any role)
      description: Overdue loans first, then the oldest loan first. `q` is a case-insensitive substring match over item code and description.
      parameters:
        - { name: assignee_location_id, in: query, schema: { type: integer, format: int64 } }
        - { name: overdue, in: query, description: "`true` keeps only loans past their `due_at`.", schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: One page of active assignments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignmentPage" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /items/{id}/maintenance:
    post:
      operationId: createMaintenance
      summary: Report a failure or register a preventive service (operator or admin)
      description: |
        `kind` selects the flow; fields that belong to the other kind are rejected with 422 naming the field. The item row is locked and the record and the item are written in one transaction. Works while the item is on loan (custody is not touched).
        - **corrective** (failure report): creates an *open* record. `reported_at` is the failure date (default now, never in the future); `destination` is free text such as "Taller de Reparación Interno" or "Espera de Repuestos". The item becomes `inoperative` (default) or `in_repair` (`item_status`). An item with an open failure rejects another with 409 `open_failure_exists`; the database guarantees at most one open failure per item, so parallel reports yield exactly one 201.
        - **preventive**: created already closed. `performed_at` (default now, never in the future), optional `cost`, optional `next_due_at` (after `performed_at`; derived as `performed_at` plus the item's `maintenance_interval_days` when omitted and the item has an interval). Sets the item's `last_maintenance_at` (never moving it backwards) and leaves its status untouched.
        - Only assets (422 `not_applicable` for consumables). Soft-deleted items return 404.
      parameters:
        - { $ref: "#/components/parameters/ItemId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMaintenanceRequest" }
      responses:
        "201":
          description: Record created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceRecord" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    get:
      operationId: listItemMaintenance
      summary: Maintenance history of an item (any role)
      description: Newest first (`reported_at`, then id). Soft-deleted items return 404.
      parameters:
        - { $ref: "#/components/parameters/ItemId" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: One page of records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceRecordPage" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /maintenance:
    get:
      operationId: listMaintenance
      summary: Maintenance records across items (any role)
      description: Open records first, then newest first. Records of soft-deleted items are not listed. `destination` is an exact, case-insensitive match; `q` is a case-insensitive substring over item code, item description and record description.
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/MaintenanceStatus" } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/MaintenanceKind" } }
        - { name: destination, in: query, schema: { type: string } }
        - { name: item_id, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: One page of records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceRecordPage" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /maintenance/due:
    get:
      operationId: listDueMaintenance
      summary: Assets whose preventive maintenance is overdue or coming due (any role)
      description: |
        Assets with `maintenance_interval_days` whose `maintenance_due_at` is at or before now plus `within_days` (0 to 365, default 0, so only overdue assets). Most overdue first, then by code. Soft-deleted items and consumables are never listed.
      parameters:
        - { name: within_days, in: query, schema: { type: integer, minimum: 0, maximum: 365, default: 0 } }
        - { name: category_id, in: query, schema: { type: integer, format: int64 } }
        - { name: q, in: query, description: Case-insensitive substring over item code and description., schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: One page of due assets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DueMaintenancePage" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      summary: Home-screen summary (any role)
      description: |
        Read-only snapshot of the inventory for the mobile home screen. Soft-deleted items are excluded. `assets.available` (functional and not on loan) and `assets.unavailable` partition the assets; `on_loan`, `inoperative` and `in_repair` overlap them. `low_stock.top` lists up to 5 consumables, lowest `stock_current / stock_min` first; `loans.overdue_top` up to 5 active loans past `due_at`, oldest first; `maintenance.overdue_top` up to 5 assets past `maintenance_due_at`, most overdue first.
      responses:
        "200":
          description: The dashboard summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
        "401": { $ref: "#/components/responses/Error" }
  /maintenance/{id}:
    patch:
      operationId: updateMaintenance
      summary: Edit an open failure record (operator or admin)
      description: |
        Changes `description` and/or `destination` (`null` or blank clears it) and can move the item between `inoperative` and `in_repair` through `item_status`. At least one field is required. A closed record is immutable (409 `record_closed`).
      parameters:
        - { $ref: "#/components/parameters/NumericId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMaintenanceRequest" }
      responses:
        "200":
          description: The updated record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceRecord" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /maintenance/{id}/close:
    post:
      operationId: closeMaintenance
      summary: Close an open failure record (operator or admin)
      description: |
        Closes the repair: `closed_at` (default now, between `reported_at` and now), optional `cost` and `resolution_note`, and `item_status_after` (`functional` by default, or `inoperative`). The item status is set accordingly and, when it comes back `functional`, `items.last_maintenance_at` is set to `closed_at` (never moving backwards). The request body is optional. Closing a closed record is 409 `record_closed`.
      parameters:
        - { $ref: "#/components/parameters/NumericId" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloseMaintenanceRequest" }
      responses:
        "200":
          description: The closed record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceRecord" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    NumericId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ItemId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
  schemas:
    Role:
      type: string
      enum: [admin, operator, viewer]
    User:
      type: object
      required: [id, name, email, role, active, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Category:
      type: object
      required: [id, name, code_prefix]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        code_prefix: { type: string, example: HER }
    Supplier:
      type: object
      required: [id, name, contact_name, email, phone, notes, active, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        contact_name: { type: string }
        email: { type: string }
        phone: { type: string }
        notes: { type: string }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PurchaseOrderStatus:
      type: string
      enum: [draft, ordered, partially_received, received, cancelled]
    Currency:
      type: string
      enum: [USD, VES]
    PurchaseOrderNewItem:
      type: object
      description: Definition of an item to create on first receipt; validated by the catalog rules when saved.
      required: [description, category_id, kind]
      properties:
        description: { type: string, maxLength: 500 }
        category_id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/ItemKind" }
        unit: { type: string, maxLength: 30, description: Required for consumables, not allowed for assets. }
        stock_min: { type: integer, minimum: 0 }
        attributes: { type: object, additionalProperties: true }
        notes: { type: string, maxLength: 4000 }
    PurchaseOrderLineInput:
      type: object
      description: >-
        Exactly one of `item_id` and `new_item`. The read-only fields `id`, `description` and `received_qty` of a
        fetched line are accepted and ignored.
      required: [quantity, unit_cost_minor]
      properties:
        item_id: { type: string, format: uuid, description: An existing consumable. }
        new_item: { $ref: "#/components/schemas/PurchaseOrderNewItem" }
        quantity: { type: integer, minimum: 1, maximum: 100000, description: Assets (`new_item.kind=asset`) up to 100. }
        unit_cost_minor: { type: integer, format: int64, minimum: 0, description: Unit cost in minor units (cents or céntimos). }
    PurchaseOrderLine:
      type: object
      required: [id, item_id, new_item, description, quantity, received_qty, unit_cost_minor]
      properties:
        id: { type: integer, format: int64 }
        item_id:
          type: string
          format: uuid
          nullable: true
          description: The existing item, or for a `new_item` line the first item created once something was received.
        new_item:
          allOf: [{ $ref: "#/components/schemas/PurchaseOrderNewItem" }]
          nullable: true
        description: { type: string, description: Snapshot taken when the line was saved. }
        quantity: { type: integer }
        received_qty: { type: integer }
        unit_cost_minor: { type: integer, format: int64 }
    PurchaseOrderCreate:
      type: object
      required: [supplier_id, currency]
      properties:
        supplier_id: { type: integer, format: int64 }
        currency: { $ref: "#/components/schemas/Currency" }
        exchange_rate:
          type: number
          nullable: true
          description: VES per USD, for reference only; never used to convert stored amounts.
        expected_at: { type: string, format: date, nullable: true }
        notes: { type: string, maxLength: 1000 }
        lines:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/PurchaseOrderLineInput" }
    PurchaseOrderUpdate:
      type: object
      properties:
        supplier_id: { type: integer, format: int64 }
        currency: { $ref: "#/components/schemas/Currency" }
        exchange_rate: { type: number, nullable: true }
        expected_at: { type: string, format: date, nullable: true }
        notes: { type: string, maxLength: 1000 }
        lines:
          type: array
          maxItems: 200
          description: Replaces the whole line set.
          items: { $ref: "#/components/schemas/PurchaseOrderLineInput" }
    ReceiptItem:
      type: object
      required: [item_id, quantity]
      properties:
        item_id: { type: string, format: uuid }
        code: { type: string, description: Catalog code of the item. }
        quantity: { type: integer, description: 1 for each created asset; the received quantity for a consumable. }
    ReceiptLine:
      type: object
      required: [line_id, quantity, items]
      properties:
        line_id: { type: integer, format: int64 }
        quantity: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/ReceiptItem" }
    PurchaseReceipt:
      type: object
      required: [id, order_id, location_id, received_by, received_at, note, lines]
      properties:
        id: { type: integer, format: int64 }
        order_id: { type: integer, format: int64 }
        location_id: { type: integer, format: int64 }
        received_by: { type: string, format: uuid, nullable: true }
        received_at: { type: string, format: date-time }
        note: { type: string }
        client_key: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/ReceiptLine" }
    PurchaseOrder:
      type: object
      required: [id, supplier_id, supplier_name, status, currency, exchange_rate, expected_at, notes, total_minor, lines, created_at, updated_at, ordered_at, cancelled_at]
      properties:
        id: { type: integer, format: int64 }
        supplier_id: { type: integer, format: int64 }
        supplier_name: { type: string }
        status: { $ref: "#/components/schemas/PurchaseOrderStatus" }
        currency: { $ref: "#/components/schemas/Currency" }
        exchange_rate: { type: number, nullable: true }
        expected_at: { type: string, format: date, nullable: true }
        notes: { type: string }
        total_minor: { type: integer, format: int64, description: Sum of quantity times unit_cost_minor, in minor units of `currency`. }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PurchaseOrderLine" }
        receipts:
          type: array
          description: Present on single-order responses, oldest first.
          items: { $ref: "#/components/schemas/PurchaseReceipt" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        ordered_at: { type: string, format: date-time, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
    ReceiveRequest:
      type: object
      required: [location_id, lines]
      properties:
        location_id: { type: integer, format: int64 }
        note: { type: string, maxLength: 400 }
        client_key: { type: string, maxLength: 100, description: Idempotency key, unique per order. }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [line_id, quantity]
            properties:
              line_id: { type: integer, format: int64 }
              quantity: { type: integer, minimum: 1 }
    ReceiveResult:
      type: object
      required: [receipt, order]
      properties:
        receipt: { $ref: "#/components/schemas/PurchaseReceipt" }
        order: { $ref: "#/components/schemas/PurchaseOrder" }
    LocationKind:
      type: string
      enum: [storage, container, person]
    Location:
      type: object
      required: [id, name, kind, parent_id]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { $ref: "#/components/schemas/LocationKind" }
        parent_id: { type: integer, format: int64, nullable: true }
    ItemKind:
      type: string
      enum: [asset, consumable]
    ItemStatus:
      type: string
      enum: [functional, inoperative, in_repair]
    Availability:
      type: string
      enum: [available, unavailable]
      description: Derived, never stored. `available` means status is `functional` and the item has no active loan.
    Item:
      type: object
      required: [id, code, description, category_id, kind, status, availability, unit, stock_current, stock_min, low_stock, on_loan, location_id, last_maintenance_at, maintenance_interval_days, maintenance_due_at, maintenance_overdue, attributes, notes, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: ISK-HER-001 }
        description: { type: string }
        category_id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/ItemKind" }
        status: { $ref: "#/components/schemas/ItemStatus" }
        availability: { $ref: "#/components/schemas/Availability" }
        unit: { type: string, nullable: true }
        stock_current: { type: integer, description: "Total quantity. For consumables it always equals the sum of `stocks`." }
        stock_min: { type: integer }
        stocks:
          type: array
          description: Consumables only (empty for assets and for consumables with no stock). Quantity per location with stock, ordered by location name.
          items: { $ref: "#/components/schemas/ItemStock" }
        low_stock: { type: boolean }
        on_loan: { type: boolean, description: True while the item has an active custody assignment. While on loan the item cannot be deleted and its `location_id` cannot be changed through PATCH (409 `item_on_loan`). }
        custody: { $ref: "#/components/schemas/ItemCustody" }
        location_id: { type: integer, format: int64, nullable: true, description: "An asset's location. Always null for consumables, which are stocked per location (see `stocks`)." }
        last_maintenance_at: { type: string, format: date-time, nullable: true }
        maintenance_interval_days: { type: integer, nullable: true }
        maintenance_due_at: { type: string, format: date-time, nullable: true, description: "Derived, never stored: `last_maintenance_at` (or `created_at` if never serviced) plus `maintenance_interval_days` 24-hour days. Null for consumables and assets without an interval." }
        maintenance_overdue: { type: boolean, description: True when `maintenance_due_at` is in the past. }
        attributes: { type: object, additionalProperties: true, description: "Free-form JSON object (brand, color, level...), up to 8 KB." }
        notes: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ItemStock:
      type: object
      required: [location_id, location_name, quantity]
      properties:
        location_id: { type: integer, format: int64 }
        location_name: { type: string }
        quantity: { type: integer, minimum: 1 }
    ItemStockInput:
      type: object
      required: [location_id, quantity]
      properties:
        location_id: { type: integer, format: int64, description: An existing location; each location at most once. }
        quantity: { type: integer, minimum: 1 }
    ItemCustody:
      type: object
      description: Present only while the item is on loan.
      required: [assignee_location_id, assignee_name, assigned_at, due_at, overdue]
      properties:
        assignee_location_id: { type: integer, format: int64 }
        assignee_name: { type: string }
        assigned_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time, nullable: true }
        overdue: { type: boolean, description: True when `due_at` has passed. }
    ItemCreate:
      type: object
      required: [description, category_id, kind]
      properties:
        code: { type: string, description: Admin only. Omit to generate one. }
        description: { type: string, maxLength: 500 }
        category_id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/ItemKind" }
        status: { $ref: "#/components/schemas/ItemStatus" }
        unit: { type: string, maxLength: 30, description: Required for consumables; not allowed for assets. }
        stock_current: { type: integer, minimum: 0, description: "Legacy opening balance (consumables), placed at `location_id` or, without one, in the default location \"Sin ubicación\". Cannot be combined with `stocks`." }
        stocks:
          type: array
          description: "Multi-location opening balance (consumables), one `opening` movement per row. Cannot be combined with `stock_current` or `location_id`; not allowed for assets."
          items: { $ref: "#/components/schemas/ItemStockInput" }
        stock_min: { type: integer, minimum: 0 }
        location_id: { type: integer, format: int64, nullable: true, description: "An asset's location; for a consumable only the location of the legacy `stock_current` balance (it is not stored on the item)." }
        last_maintenance_at: { type: string, format: date-time, nullable: true }
        maintenance_interval_days: { type: integer, minimum: 1, maximum: 3650, nullable: true }
        attributes: { type: object, additionalProperties: true }
        notes: { type: string, maxLength: 4000 }
    ItemUpdate:
      type: object
      properties:
        description: { type: string, maxLength: 500 }
        category_id: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/ItemStatus" }
        unit: { type: string, maxLength: 30 }
        stock_min: { type: integer, minimum: 0 }
        location_id: { type: integer, format: int64, nullable: true, description: Assets only; a non-null value on a consumable is 422 `not_applicable`. }
        maintenance_interval_days: { type: integer, minimum: 1, maximum: 3650, nullable: true }
        attributes: { type: object, additionalProperties: true }
        notes: { type: string, maxLength: 4000 }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: >-
                Stable machine code. Generic: invalid_request, unauthorized, forbidden, not_found, conflict,
                rate_limited, validation_failed, internal_error. Identity: invalid_credentials,
                invalid_current_password, email_taken, last_admin. Catalog: category_name_taken,
                category_prefix_taken, category_in_use, location_in_use, location_cycle, code_taken.
                Stock and custody: insufficient_stock, item_on_loan, already_assigned, not_assigned,
                item_not_available, not_applicable, location_required (422, with `fields`). Maintenance: open_failure_exists, record_closed,
                item_under_repair. Suppliers: supplier_name_taken. Purchasing: invalid_state (409, the message names the
                current status), over_receipt and supplier_inactive (422, with `fields`).
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
              description: Present on 422 `validation_failed`; maps each offending field to a message.
    MovementType:
      type: string
      enum: [opening, in, out, adjust, transfer]
    MovementRequest:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [in, out, adjust, transfer] }
        qty: { type: integer, description: "Amount for in/out; absolute counted quantity at the location for adjust; quantity to move for a consumable transfer; omit or 0 for an asset transfer." }
        location_id: { type: integer, format: int64, description: "Consumable in/out/adjust: the location it applies to. Inferred when omitted (see the endpoint description; 422 `location_required` when ambiguous). Not allowed for transfer." }
        from_location_id: { type: integer, format: int64, description: Consumable transfer only. Source location; inferred when the item has a single stocked location. }
        to_location_id: { type: integer, format: int64, description: Required for transfer; not allowed otherwise. }
        note: { type: string, maxLength: 500, description: Required (non-empty) for adjust. }
    Movement:
      type: object
      required: [id, item_id, type, qty, stock_before, stock_after, location_id, from_location_id, to_location_id, moved_qty, user_id, user_name, note, created_at]
      properties:
        id: { type: integer, format: int64 }
        item_id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/MovementType" }
        qty: { type: integer, description: Signed delta applied to the item's total stock; 0 for transfers. }
        stock_before: { type: integer, description: Item total before the movement. }
        stock_after: { type: integer, description: Item total after the movement. }
        location_id: { type: integer, format: int64, nullable: true, description: "Consumable in/out/adjust/opening: the location affected. Null for transfers and for legacy rows whose location is unknown." }
        from_location_id: { type: integer, format: int64, nullable: true }
        to_location_id: { type: integer, format: int64, nullable: true }
        moved_qty: { type: integer, description: Quantity moved by a consumable transfer; 0 otherwise. }
        user_id: { type: string, format: uuid, nullable: true, description: Null for system rows (migration backfill). }
        user_name: { type: string, nullable: true }
        note: { type: string }
        created_at: { type: string, format: date-time }
    MovementResult:
      type: object
      required: [movement, stock_current, location_id, stocks]
      properties:
        movement: { $ref: "#/components/schemas/Movement" }
        stock_current: { type: integer, description: Item total stock after the movement. }
        location_id: { type: integer, format: int64, nullable: true, description: An asset's location after the movement; null for consumables. }
        stocks:
          type: array
          description: A consumable's per-location stock after the movement (empty for assets).
          items: { $ref: "#/components/schemas/ItemStock" }
    StockAlert:
      type: object
      required: [item_id, code, description, unit, stock_current, stock_min, shortage, location_id, location_name, stocks]
      properties:
        item_id: { type: string, format: uuid }
        code: { type: string }
        description: { type: string }
        unit: { type: string }
        stock_current: { type: integer }
        stock_min: { type: integer }
        shortage: { type: integer, description: stock_current - stock_min; lower is more severe. }
        location_id: { type: integer, format: int64, nullable: true, description: Set only when all the stock sits in one location. }
        location_name: { type: string, nullable: true, description: Set only when all the stock sits in one location. }
        stocks:
          type: array
          description: Per-location breakdown of `stock_current`, ordered by location name.
          items: { $ref: "#/components/schemas/ItemStock" }
    AssignRequest:
      type: object
      required: [assignee_location_id]
      properties:
        assignee_location_id: { type: integer, format: int64, description: A location of kind `person` or `container`. }
        due_at: { type: string, format: date-time, nullable: true, description: Must be in the future. }
        note: { type: string, maxLength: 500 }
    ReturnRequest:
      type: object
      properties:
        return_location_id: { type: integer, format: int64, nullable: true, description: Defaults to the location the item had when lent. }
        note: { type: string, maxLength: 500 }
    Assignment:
      type: object
      required: [id, item_id, item_code, item_description, assignee_location_id, assignee_name, assignee_kind, origin_location_id, origin_name, assigned_at, due_at, overdue, returned_at, returned_to_location_id, returned_to_name, assigned_by, assigned_by_name, returned_by, returned_by_name, assign_note, return_note, created_at]
      properties:
        id: { type: integer, format: int64 }
        item_id: { type: string, format: uuid }
        item_code: { type: string }
        item_description: { type: string }
        assignee_location_id: { type: integer, format: int64 }
        assignee_name: { type: string }
        assignee_kind: { type: string, enum: [person, container, storage], description: Kind at read time; new loans only accept person or container. }
        origin_location_id: { type: integer, format: int64, nullable: true, description: Where the item was when lent. }
        origin_name: { type: string, nullable: true }
        assigned_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time, nullable: true }
        overdue: { type: boolean, description: True for an active assignment past its due date. }
        returned_at: { type: string, format: date-time, nullable: true, description: Null while the loan is active. }
        returned_to_location_id: { type: integer, format: int64, nullable: true }
        returned_to_name: { type: string, nullable: true }
        assigned_by: { type: string, format: uuid }
        assigned_by_name: { type: string }
        returned_by: { type: string, format: uuid, nullable: true }
        returned_by_name: { type: string, nullable: true }
        assign_note: { type: string }
        return_note: { type: string }
        created_at: { type: string, format: date-time }
    AssignmentPage:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Assignment" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    MaintenanceKind:
      type: string
      enum: [preventive, corrective]
    MaintenanceStatus:
      type: string
      enum: [open, closed]
    CreateMaintenanceRequest:
      type: object
      required: [kind, description]
      properties:
        kind: { $ref: "#/components/schemas/MaintenanceKind" }
        description: { type: string, minLength: 1, maxLength: 1000 }
        reported_at: { type: string, format: date-time, description: "Corrective only: failure date. Defaults to now; not in the future." }
        destination: { type: string, maxLength: 120, description: "Corrective only: where the asset went, for example Taller de Reparación Interno or Espera de Repuestos." }
        item_status: { type: string, enum: [inoperative, in_repair], default: inoperative, description: "Corrective only: the status the item takes." }
        performed_at: { type: string, format: date-time, description: "Preventive only: date performed. Defaults to now; not in the future." }
        cost: { type: number, minimum: 0, description: "Preventive only (use close for corrective). Two decimals." }
        next_due_at: { type: string, format: date-time, description: "Preventive only: must be after performed_at. Derived from the item's interval when omitted." }
    UpdateMaintenanceRequest:
      type: object
      properties:
        description: { type: string, minLength: 1, maxLength: 1000 }
        destination: { type: string, maxLength: 120, nullable: true, description: Null or blank clears it. }
        item_status: { type: string, enum: [inoperative, in_repair] }
    CloseMaintenanceRequest:
      type: object
      properties:
        closed_at: { type: string, format: date-time, description: Defaults to now; not before reported_at and not in the future. }
        cost: { type: number, minimum: 0 }
        resolution_note: { type: string, maxLength: 1000 }
        item_status_after: { type: string, enum: [functional, inoperative], default: functional }
    MaintenanceRecord:
      type: object
      required: [id, item_id, item_code, item_description, item_status, kind, status, reported_at, description, destination, cost, next_due_at, closed_at, resolution_note, reported_by, reported_by_name, closed_by, closed_by_name, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        item_id: { type: string, format: uuid }
        item_code: { type: string }
        item_description: { type: string }
        item_status: { type: string, enum: [functional, inoperative, in_repair], description: The item's current status (after this write when returned by a write). }
        kind: { $ref: "#/components/schemas/MaintenanceKind" }
        status: { $ref: "#/components/schemas/MaintenanceStatus" }
        reported_at: { type: string, format: date-time, description: Failure date (corrective) or date performed (preventive). }
        description: { type: string }
        destination: { type: string, nullable: true }
        cost: { type: number, nullable: true }
        next_due_at: { type: string, format: date-time, nullable: true, description: Preventive only. }
        closed_at: { type: string, format: date-time, nullable: true, description: Null while the failure is open; equals reported_at for preventive records. }
        resolution_note: { type: string, nullable: true }
        reported_by: { type: string, format: uuid }
        reported_by_name: { type: string }
        closed_by: { type: string, format: uuid, nullable: true }
        closed_by_name: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MaintenanceRecordPage:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/MaintenanceRecord" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    DueMaintenance:
      type: object
      required: [item_id, code, description, category_id, category_name, status, location_id, location_name, last_maintenance_at, maintenance_interval_days, maintenance_due_at, maintenance_overdue]
      properties:
        item_id: { type: string, format: uuid }
        code: { type: string }
        description: { type: string }
        category_id: { type: integer, format: int64 }
        category_name: { type: string }
        status: { type: string, enum: [functional, inoperative, in_repair] }
        location_id: { type: integer, format: int64, nullable: true }
        location_name: { type: string, nullable: true }
        last_maintenance_at: { type: string, format: date-time, nullable: true }
        maintenance_interval_days: { type: integer }
        maintenance_due_at: { type: string, format: date-time }
        maintenance_overdue: { type: boolean }
    DueMaintenancePage:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/DueMaintenance" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    DashboardSummary:
      type: object
      required: [generated_at, items, assets, low_stock, loans, maintenance]
      properties:
        generated_at: { type: string, format: date-time }
        items:
          type: object
          required: [total, assets, consumables]
          properties:
            total: { type: integer }
            assets: { type: integer }
            consumables: { type: integer }
        assets:
          type: object
          required: [available, unavailable, on_loan, inoperative, in_repair]
          properties:
            available: { type: integer }
            unavailable: { type: integer }
            on_loan: { type: integer }
            inoperative: { type: integer }
            in_repair: { type: integer }
        low_stock:
          type: object
          required: [count, top]
          properties:
            count: { type: integer }
            top:
              type: array
              maxItems: 5
              items:
                type: object
                required: [id, code, description, unit, stock_current, stock_min, location_name, stocks]
                properties:
                  id: { type: string, format: uuid }
                  code: { type: string }
                  description: { type: string }
                  unit: { type: string }
                  stock_current: { type: integer }
                  stock_min: { type: integer }
                  location_name: { type: string, nullable: true, description: Set only when all the stock sits in one location. }
                  stocks:
                    type: array
                    items: { $ref: "#/components/schemas/ItemStock" }
        loans:
          type: object
          required: [active, overdue, overdue_top]
          properties:
            active: { type: integer }
            overdue: { type: integer }
            overdue_top:
              type: array
              maxItems: 5
              items:
                type: object
                required: [item_id, code, description, assignee_name, due_at]
                properties:
                  item_id: { type: string, format: uuid }
                  code: { type: string }
                  description: { type: string }
                  assignee_name: { type: string }
                  due_at: { type: string, format: date-time }
        maintenance:
          type: object
          required: [open_failures, overdue, overdue_top]
          properties:
            open_failures: { type: integer }
            overdue: { type: integer }
            overdue_top:
              type: array
              maxItems: 5
              items:
                type: object
                required: [item_id, code, description, maintenance_due_at]
                properties:
                  item_id: { type: string, format: uuid }
                  code: { type: string }
                  description: { type: string }
                  maintenance_due_at: { type: string, format: date-time }
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Session:
      description: Access token and user; sets the httpOnly `refresh_token` cookie.
      headers:
        Set-Cookie:
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            required: [access_token, token_type, expires_in, user]
            properties:
              access_token: { type: string }
              token_type: { type: string, example: Bearer }
              expires_in: { type: integer, description: Seconds until the access token expires }
              user: { $ref: "#/components/schemas/User" }
